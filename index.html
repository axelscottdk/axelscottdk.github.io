<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WABA</title>
<style>
:root{color-scheme:dark;--bg:#11110f;--ink:#eceae4;--muted:#9a968c;--line:#2a2925}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:18px/1.45 Palatino,serif;min-height:100vh;display:grid;place-items:center;padding:2.5rem 1.25rem}
main{max-width:36rem}
.kicker{font:12px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 .75rem}
h1{font-size:3.25rem;letter-spacing:-.04em;margin:0 0 1rem}
p{margin:0 0 1.25rem;color:var(--muted)}
pre{font:13px/1.55 ui-monospace,Menlo,monospace;background:#1a1916;border:1px solid var(--line);padding:1rem 1.1rem;overflow:auto;color:var(--ink)}
a{color:var(--ink)}
</style>
</head>
<body>
<main>
<p class="kicker">Intern videresalgs-drift</p>
<h1>WABA</h1>
<p>Appen kører ikke her. GitHub Pages er kun statiske filer. Kernen kører lokalt.</p>
<p>Se README i <a href="https://github.com/axelscottdk/waba">repoet</a>.</p>
</main>
</body>
</html>
